<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ .Title }}</title>
    {{ template "styling" . }}
  </head>

  <body class="min-h-screen bg-base-200 text-base-content">
    <a href="#main-content" class="sr-only z-50 rounded-lg bg-base-100 px-3 py-2 text-sm font-medium focus:not-sr-only focus:fixed focus:left-3 focus:top-3">
      Skip to content
    </a>
    {{ template "navbar" . }}

    <main id="main-content" class="pb-12">
      <div class="app-shell py-4 sm:py-6">
        <div class="grid gap-5 xl:grid-cols-12">
          <section class="xl:col-span-8">
            <div class="surface-card p-2 sm:p-3">
              <div
                id="player"
                class="relative overflow-hidden rounded-2xl bg-black"
                style="aspect-ratio: 16/9; min-height: 220px"
              >
                <iframe
                  id="playerIframe"
                  class="absolute inset-0 h-full w-full"
                  src="{{ .player_url }}"
                  width="100%"
                  height="100%"
                  webkitAllowFullScreen
                  mozallowfullscreen
                  allowfullscreen
                  allow="autoplay"
                ></iframe>
              </div>
              <div class="mt-3 flex justify-center">
                <button id="aspect-43-toggle" class="btn btn-outline btn-sm rounded-xl" onclick="toggleAspectRatio()" aria-label="Toggle player aspect ratio">
                  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="size-5">
                    <path
                      fill-rule="evenodd"
                      d="M12 2.25a.75.75 0 0 1 .75.75v16.19l6.22-6.22a.75.75 0 1 1 1.06 1.06l-7.5 7.5a.75.75 0 0 1-1.06 0l-7.5-7.5a.75.75 0 1 1 1.06-1.06l6.22 6.22V3a.75.75 0 0 1 .75-.75Z"
                      clip-rule="evenodd"
                    />
                  </svg>
                </button>
              </div>
            </div>
          </section>

          <aside class="xl:col-span-4">
            <div id="epg_parent" class="surface-card h-full p-4 sm:p-5">
              <h2 class="section-heading">Now Playing</h2>
              <div id="epg" class="mt-4">
                <div class="card rounded-2xl border border-base-300/70 bg-base-100 shadow-sm">
                  <figure class="overflow-hidden rounded-t-2xl">
                    <img id="episodePoster" alt="Episode Poster" class="h-48 w-full object-cover" />
                  </figure>
                  <div class="card-body p-4">
                    <h2 id="showname" class="card-title text-base"></h2>
                    <div class="flex items-center justify-between gap-3">
                      <div class="badge badge-error badge-outline">Live</div>
                      <div class="text-xs text-base-content/70 sm:text-sm">
                        <span>Ends in </span>
                        <span id="countdown_hour" class="countdown">
                          <span id="e_hour" style="--value:0;"></span>h
                        </span>
                        <span id="countdown_minute" class="countdown">
                          <span id="e_minute" style="--value:0;"></span>m
                        </span>
                        <span id="countdown_second" class="countdown">
                          <span id="e_second" style="--value:0;"></span>s
                        </span>
                      </div>
                    </div>
                    <p id="description" class="text-sm text-base-content/80"></p>
                    <div id="keywords" class="card-actions justify-end">
                      <div class="hidden badge badge-outline"></div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </aside>
        </div>

        <section id="similar_channels_parent" class="mt-6 hidden">
          <div class="mb-3 flex items-end justify-between gap-3">
            <h2 class="section-heading">Similar Channels</h2>
            <p class="muted-copy hidden sm:block">Picked from matching category and language.</p>
          </div>
          <div id="similar_channels" class="grid grid-cols-2 gap-3 sm:grid-cols-3 lg:grid-cols-4 xl:grid-cols-6">
            <!-- Similar channels are populated by JavaScript -->
          </div>
        </section>
      </div>
    </main>

    <script>
      const channelId = {{ printf "%q" .ChannelID }};
      let current43Mode = false;

      const DOWN_ARROW_SVG = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="size-5"><path fill-rule="evenodd" d="M12 2.25a.75.75 0 0 1 .75.75v16.19l6.22-6.22a.75.75 0 1 1 1.06 1.06l-7.5 7.5a.75.75 0 0 1-1.06 0l-7.5-7.5a.75.75 0 1 1 1.06-1.06l6.22 6.22V3a.75.75 0 0 1 .75-.75Z" clip-rule="evenodd" /></svg>';
      const UP_ARROW_SVG = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="size-5"><path fill-rule="evenodd" d="M11.47 2.47a.75.75 0 0 1 1.06 0l7.5 7.5a.75.75 0 1 1-1.06 1.06l-6.22-6.22V21a.75.75 0 0 1-1.5 0V4.81l-6.22 6.22a.75.75 0 1 1-1.06-1.06l7.5-7.5Z" clip-rule="evenodd" /></svg>';

      function updateAspectRatioUI(is43Mode) {
        const playerContainer = document.getElementById("player");
        const button = document.getElementById("aspect-43-toggle");

        if (is43Mode) {
          playerContainer.style.aspectRatio = "4/3";
          button.classList.add("btn-active");
          button.innerHTML = UP_ARROW_SVG;
        } else {
          playerContainer.style.aspectRatio = "16/9";
          button.classList.remove("btn-active");
          button.innerHTML = DOWN_ARROW_SVG;
        }
      }

      function toggleAspectRatio() {
        if (current43Mode) {
          current43Mode = false;
          localStorage.removeItem("aspectRatio_" + channelId);
        } else {
          current43Mode = true;
          localStorage.setItem("aspectRatio_" + channelId, "4/3");
        }
        updateAspectRatioUI(current43Mode);
      }

      document.addEventListener("DOMContentLoaded", function () {
        const saved43Mode = localStorage.getItem("aspectRatio_" + channelId) === "4/3";
        if (saved43Mode) {
          current43Mode = true;
        }
        updateAspectRatioUI(current43Mode);
      });
    </script>
    <script src="/static/internal/utils.js"></script>
    <script src="/static/internal/common.js"></script>
    <script src="/static/internal/epg.js"></script>
    {{ template "footer" . }}
  </body>
</html>
