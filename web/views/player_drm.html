<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JioTV Go</title>
    <style>
      html,
      body {
        height: 100%;
      }

      body {
        margin: 0;
        background: radial-gradient(circle at top, #101827 0%, #05070d 60%);
        overflow: hidden;
      }

      .player-shell {
        height: 100%;
        width: 100%;
      }

      .unmute-overlay {
        position: absolute;
        top: 50%;
        left: 50%;
        z-index: 1000;
        display: flex;
        height: 78px;
        width: 78px;
        cursor: pointer;
        align-items: center;
        justify-content: center;
        border: 0;
        border-radius: 9999px;
        background: rgba(239, 68, 68, 0.92);
        color: white;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.35);
        transform: translate(-50%, -50%);
        transition: transform 0.25s ease, opacity 0.25s ease, background-color 0.25s ease;
      }

      .unmute-overlay:hover {
        transform: translate(-50%, -50%) scale(1.08);
        background: rgba(239, 68, 68, 1);
      }

      .unmute-overlay svg {
        width: 30px;
        height: 30px;
        fill: currentColor;
      }

      .unmute-overlay.hidden {
        opacity: 0;
        pointer-events: none;
      }

      .shaka-video-container .material-icons-round {
        font-size: 28px !important;
      }
    </style>
    <script src="/static/external/shaka-player.ui.js"></script>
    <link rel="stylesheet" href="/static/external/shaka-player-controls.css" />
  </head>

  <body>
    <div class="player-shell" data-shaka-player-container>
      <video
        autoplay
        muted
        data-shaka-player
        id="jiotv_go_player"
        style="width: 100%; height: 100%"
      ></video>

      <button id="unmute-btn" class="unmute-overlay" title="Click to unmute">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
          <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
        </svg>
      </button>
    </div>
    <script>
      document.addEventListener("shaka-ui-loaded", async () => {
        const video = document.getElementById("jiotv_go_player");
        const ui = video["ui"];
        const config = {
          seekBarColors: {
            base: "rgba(234, 67, 53, 0.5)",
            buffered: "rgba(234, 67, 53, 0.7)",
            played: "rgb(234, 67, 53)",
          },
          volumeBarColors: {
            base: "rgba(234, 67, 53, 0.5)",
            level: "rgb(234, 67, 53)",
          },
        };
        ui.configure(config);

        const controls = ui.getControls();
        const player = controls.getPlayer();

        player.configure({
          drm: {
            servers: {
              "com.widevine.alpha": "{{ .license_url }}",
            },
            advanced: {
              "com.widevine.alpha": {
                videoRobustness: "SW_SECURE_CRYPTO",
                audioRobustness: "SW_SECURE_CRYPTO",
              },
            },
          },
          streaming: {
            retryParameters: {
              maxAttempts: 3,
            },
            bufferingGoal: 5,
          },
        });

        player.getNetworkingEngine().registerRequestFilter(function (type, request, context) {
          if (
            type == shaka.net.NetworkingEngine.RequestType.SEGMENT &&
            request.uris[0].includes("/render.dash")
          ) {
            const newUrl = new URL(request.uris[0]);
            const channelHost = "{{ .channel_host }}";
            const channelPath = "{{ .channel_path }}";
            if (channelHost !== "" && channelPath !== "") {
              newUrl.searchParams.append("host", channelHost);
              newUrl.searchParams.append("path", channelPath);
            }
            request.uris = [newUrl.toString()];
          }
        });

        try {
          await player.load("{{ .play_url }}");
        } catch (e) {
          console.error("Error loading video", e);
          switch (e.code) {
            case 1001:
              alert("The channel is not available.");
              break;
            case 6001:
              alert("Widevine DRM content can't be played in http (except localhost). Please enable https in server.");
              break;
            default:
              alert("An error occurred. Please try again later. Shaka Error code: " + e.code);
          }
        }

        const unmuteBtn = document.getElementById("unmute-btn");

        const updateUnmuteButton = () => {
          if (video.muted) {
            unmuteBtn.classList.remove("hidden");
          } else {
            unmuteBtn.classList.add("hidden");
          }
        };

        unmuteBtn.addEventListener("click", () => {
          video.muted = false;
          video.volume = 0.8;
          updateUnmuteButton();
        });

        video.addEventListener("volumechange", updateUnmuteButton);
        updateUnmuteButton();

        video.addEventListener("fullscreenchange", () => {
          if (document.fullscreenElement) {
            if (screen.orientation) {
              screen.orientation.lock("landscape").catch((err) => {
                if (err.name !== "NotSupportedError") {
                  console.error(err);
                }
              });
            }
          } else if (screen.orientation) {
            screen.orientation.unlock();
          }
        });
      });
    </script>
  </body>
</html>
