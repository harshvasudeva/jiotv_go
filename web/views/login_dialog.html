{{ define "login_dialog" }}
<dialog id="login_modal" class="modal modal-bottom sm:modal-middle">
  <form method="dialog" class="modal-box rounded-2xl border border-base-300/70 p-5 sm:p-6">
    <h3 class="text-lg font-semibold tracking-tight">Login to JioTV</h3>
    <p class="mt-1 text-sm text-base-content/70">Enter your Jio mobile number to receive OTP.</p>
    <div class="mt-4 flex flex-col gap-3">
      <label for="number" class="text-sm font-medium">Jio mobile number</label>
      <input
        id="number"
        type="tel"
        class="input input-bordered rounded-xl"
        placeholder="9876543210"
        pattern="[0-9]{10}"
        minlength="10"
        maxlength="10"
      />
      <button onclick="loginOTPClick()" class="btn btn-primary rounded-xl">Send OTP</button>
    </div>
  </form>
  <form method="dialog" class="modal-backdrop">
    <button>close</button>
  </form>
</dialog>
<!-- Verify OTP Modal -->
<dialog id="verify_otp_modal" class="modal modal-bottom sm:modal-middle">
  <form method="dialog" class="modal-box rounded-2xl border border-base-300/70 p-5 sm:p-6">
    <h3 class="text-lg font-semibold tracking-tight">Verify OTP</h3>
    <p class="mt-1 text-sm text-base-content/70">Use the one-time password sent to your phone.</p>
    <div class="mt-4 flex flex-col gap-3">
      <label for="otp" class="text-sm font-medium">OTP</label>
      <input
        id="otp"
        type="number"
        class="input input-bordered rounded-xl"
        placeholder="543210"
        max="999999"
        min="100000"
        required
      />
      <button onclick="loginOTPVerifyClick()" class="btn btn-primary rounded-xl">
        Verify
      </button>
    </div>
  </form>
  <form method="dialog" class="modal-backdrop">
    <button>close</button>
  </form>
</dialog>

<script>
  {{ if .IsNotLoggedIn }}
    login_modal.showModal();
  {{ else }}
    console.log("You have already logged in");
  {{ end }}
</script>
{{ end }}
