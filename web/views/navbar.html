{{ define "navbar" }}
<nav class="site-nav" role="navigation" aria-label="Main navigation">
  <div class="app-shell flex min-h-[4.25rem] items-center justify-between gap-4 py-2.5">
    <a href="/" class="group inline-flex items-center gap-3 rounded-xl px-1 py-1" aria-label="Go to home page">
      <span class="brand-mark transition duration-300 group-hover:scale-105">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="h-5 w-5" aria-hidden="true">
          <path d="M4.5 5.25A2.25 2.25 0 0 1 6.75 3h10.5a2.25 2.25 0 0 1 2.25 2.25v9a2.25 2.25 0 0 1-2.25 2.25H6.75A2.25 2.25 0 0 1 4.5 14.25v-9Zm5.03 2.3a.75.75 0 0 0-1.155.632v3.636a.75.75 0 0 0 1.156.631l2.857-1.818a.75.75 0 0 0 0-1.264L9.53 7.55Z" />
          <path d="M8.25 18.75a.75.75 0 0 0 0 1.5h7.5a.75.75 0 0 0 0-1.5h-7.5Z" />
        </svg>
      </span>
      <span class="flex flex-col leading-none">
        <span class="text-[1.05rem] font-bold tracking-tight sm:text-lg">{{ .Title }}</span>
        <span class="mt-1 hidden text-[0.7rem] font-medium uppercase tracking-[0.16em] text-base-content/45 sm:block">
          Live &amp; Premium
        </span>
      </span>
    </a>

    <div class="flex items-center gap-2">
      {{ if .player_url }}
      <label class="nav-toggle" title="Switch between the DRM and HLS player">
        <span id="player-mode-label" class="text-xs font-medium">auto</span>
        <input
          id="player-mode-toggle"
          type="checkbox"
          class="toggle toggle-xs toggle-primary"
          onchange="togglePlayerMode()"
          role="switch"
          aria-label="Toggle player mode"
        />
      </label>
      {{ end }}

      <label class="nav-toggle" title="Browse programmes that already aired">
        <span id="catchup-toggle-label" class="text-xs font-medium">Catchup: OFF</span>
        <input
          id="catchup-toggle"
          type="checkbox"
          class="toggle toggle-xs toggle-warning"
          onchange="toggleCatchupMode()"
          role="switch"
          aria-label="Toggle catchup mode"
        />
      </label>

      <label
        class="swap swap-rotate grid h-10 w-10 cursor-pointer place-items-center rounded-xl border border-base-300/60 bg-base-100/50 transition duration-200 hover:border-primary/50 hover:bg-base-100"
        aria-label="Toggle theme"
      >
        <input type="checkbox" onclick="toggleTheme()" aria-label="Switch between light and dark theme" />

        <svg
          id="sunIcon"
          class="swap-on h-[1.15rem] w-[1.15rem] fill-current"
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          aria-hidden="true"
        >
          <path
            d="M5.64,17l-.71.71a1,1,0,0,0,0,1.41,1,1,0,0,0,1.41,0l.71-.71A1,1,0,0,0,5.64,17ZM5,12a1,1,0,0,0-1-1H3a1,1,0,0,0,0,2H4A1,1,0,0,0,5,12Zm7-7a1,1,0,0,0,1-1V3a1,1,0,0,0-2,0V4A1,1,0,0,0,12,5ZM5.64,7.05a1,1,0,0,0,.7.29,1,1,0,0,0,.71-.29,1,1,0,0,0,0-1.41l-.71-.71A1,1,0,0,0,4.93,6.34Zm12,.29a1,1,0,0,0,.7-.29l.71-.71a1,1,0,1,0-1.41-1.41L17,5.64a1,1,0,0,0,0,1.41A1,1,0,0,0,17.66,7.34ZM21,11H20a1,1,0,0,0,0,2h1a1,1,0,0,0,0-2Zm-9,8a1,1,0,0,0-1,1v1a1,1,0,0,0,2,0V20A1,1,0,0,0,12,19ZM18.36,17A1,1,0,0,0,17,18.36l.71.71a1,1,0,0,0,1.41,0,1,1,0,0,0,0-1.41ZM12,6.5A5.5,5.5,0,1,0,17.5,12,5.51,5.51,0,0,0,12,6.5Zm0,9A3.5,3.5,0,1,1,15.5,12,3.5,3.5,0,0,1,12,15.5Z"
          />
        </svg>

        <svg
          id="moonIcon"
          class="swap-off h-[1.15rem] w-[1.15rem] fill-current"
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          aria-hidden="true"
        >
          <path
            d="M21.64,13a1,1,0,0,0-1.05-.14,8.05,8.05,0,0,1-3.37.73A8.15,8.15,0,0,1,9.08,5.49a8.59,8.59,0,0,1,.25-2A1,1,0,0,0,8,2.36,10.14,10.14,0,1,0,22,14.05,1,1,0,0,0,21.64,13Zm-9.5,6.69A8.14,8.14,0,0,1,7.08,5.22v.27A10.15,10.15,0,0,0,17.22,15.63a9.79,9.79,0,0,0,2.1-.22A8.11,8.11,0,0,1,12.14,19.73Z"
          />
        </svg>
      </label>

      {{ if .player_url }}
      <button
        class="btn-glass h-10 min-h-0 gap-1.5 rounded-xl px-3.5 text-sm sm:px-4"
        onclick="window.history.back()"
        aria-label="Go back to previous page"
      >
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="h-4 w-4" aria-hidden="true">
          <path fill-rule="evenodd" d="M11.03 3.97a.75.75 0 0 1 0 1.06l-6.22 6.22H21a.75.75 0 0 1 0 1.5H4.81l6.22 6.22a.75.75 0 1 1-1.06 1.06l-7.5-7.5a.75.75 0 0 1 0-1.06l7.5-7.5a.75.75 0 0 1 1.06 0Z" clip-rule="evenodd" />
        </svg>
        Back
      </button>
      {{ else }}
        {{ if .IsNotLoggedIn }}
        <button
          onclick="login_modal.showModal()"
          class="btn-premium h-10 min-h-0 rounded-xl px-4 text-sm font-semibold sm:px-5"
          aria-label="Open login dialog"
        >
          Sign in
        </button>
        {{ else }}
        <button
          onclick="window.location.href='/logout'"
          class="btn-glass h-10 min-h-0 rounded-xl px-3.5 text-sm hover:border-error/50 hover:text-error sm:px-4"
          aria-label="Logout from account"
        >
          Sign out
        </button>
        {{ end }}
      {{ end }}
    </div>
  </div>
</nav>
{{ end }}
